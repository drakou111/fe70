# Builds the volunteer app on Windows, Linux and macOS (PyInstaller cannot cross-compile).
# Needs the repository secret TILINGVOL_SUBMIT_KEY and the variable TILINGVOL_SERVER_URL.
name: build-client

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Tk (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - run: uv sync --extra client --extra server
      - name: Test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a uv run pytest -q; else uv run pytest -q; fi
      - name: Build
        env:
          TILINGVOL_SUBMIT_KEY: ${{ secrets.TILINGVOL_SUBMIT_KEY }}
          TILINGVOL_SERVER_URL: ${{ vars.TILINGVOL_SERVER_URL }}
        run: uv run python scripts/build_client.py
      - uses: actions/upload-artifact@v4
        with:
          name: GunTilingSearch-${{ runner.os }}
          path: dist/
