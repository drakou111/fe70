[project]
name = "tilingvol"
version = "0.2.0"
description = "Volunteer search for rectangle tilings by the gun polyomino B(1.2^3.1^3)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
client = ["ortools>=9.10", "psutil>=5.9", "cryptography>=42"]
server = ["fastapi>=0.110", "uvicorn>=0.29"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27", "pyinstaller>=6.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tilingvol"]

[tool.pytest.ini_options]
testpaths = ["tests"]
